<style>
:root{--bg:#f2f3ef;--card:#fff;--ink:#141821;--mut:#6b7280;--line:#e3e5df;--acc:#EE5A28;--acc2:#2BA3DC;--ok:#1f9d55;--bad:#d64531;--sh:0 1px 0 rgba(255,255,255,.7) inset,0 3px 0 rgba(0,0,0,.06),0 14px 28px -16px rgba(0,0,0,.28)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1020;--card:#151d33;--ink:#eef1f7;--mut:#9aa3b8;--line:#253153;--ok:#3ccf7d;--bad:#ff7a6a;--sh:0 1px 0 rgba(255,255,255,.05) inset,0 3px 0 rgba(0,0,0,.35),0 14px 28px -16px rgba(0,0,0,.6)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding:max(14px,env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
.w{max-width:560px;margin:0 auto}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.hd{display:flex;align-items:center;gap:12px;margin:4px 0 16px}
.hd img{width:52px;height:52px;border-radius:16px;box-shadow:0 6px 18px rgba(238,90,40,.3)}
.hd .t{flex:1;min-width:0}
.hd .t small{display:block;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.hd .t b{display:block;font-size:21px;font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf{flex:none;width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh)}
.rf svg{width:20px;height:20px}.rf.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.kl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--sh)}
.kc small{display:block;font-size:12px;font-weight:700;color:var(--mut)}
.kc b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:32px;font-weight:800;line-height:1.05}
.kc b.z{color:var(--bad)}
.kc i{font-style:normal;font-size:12px;font-weight:700;color:var(--mut)}
.sc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:14px;box-shadow:var(--sh)}
.sc>h2{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.sc>h2::before{content:"";width:5px;height:16px;border-radius:2px;background:var(--acc);transform:skewX(-18deg);margin-left:3px}
.rl{display:flex;flex-direction:column;gap:8px}
.ri{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.ri .d{flex:none;width:50px;text-align:center;border-radius:12px;background:var(--card);border:1px solid var(--line);padding:5px 0}
.ri .d small{display:block;font-size:11px;font-weight:800;color:var(--acc);text-transform:uppercase}
.ri .d b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:800;line-height:1}
.ri .x{flex:1;min-width:0}.ri .x b{display:block;font-size:16px;font-weight:800}.ri .x small{display:block;font-size:12.5px;color:var(--mut);font-weight:600}
.ip{flex:none;padding:8px 12px;border-radius:11px;border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);background:transparent;color:var(--bad);font-weight:800;font-size:13px}
.ip[disabled]{opacity:.5;border-color:var(--line);color:var(--mut)}
.em{font-size:14px;color:var(--mut);font-weight:600;text-align:center;padding:12px 6px;line-height:1.45}
.dy{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 6px;scrollbar-width:none}.dy::-webkit-scrollbar{display:none}
.dy button{flex:none;width:58px;padding:8px 0;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:1px}
.dy button small{font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase}
.dy button b{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:800;line-height:1}
.dy button i{font-style:normal;font-size:10.5px;font-weight:700;color:var(--mut)}
.dy button.on{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--acc) 60%,#000)}
.dy button.on small,.dy button.on i{color:rgba(255,255,255,.9)}
.sl{display:flex;flex-direction:column;gap:8px}
.si{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;border:1px solid var(--line);background:var(--bg)}
.si>b{font-family:"Barlow Condensed",sans-serif;font-size:24px;font-weight:800;min-width:62px}
.si .x{flex:1;min-width:0}
.tp{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--acc) 15%,transparent)}
.tp.b{background:color-mix(in srgb,#7c4dff 16%,transparent)}
.si .x small{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin-top:3px}
.si .x small.f{color:var(--bad)}.si .x small.m{color:var(--ok)}
.rz{flex:none;padding:10px 14px;border-radius:12px;border:0;background:var(--acc);color:#fff;font-weight:800;font-size:14px;box-shadow:0 4px 0 color-mix(in srgb,var(--acc) 60%,#000)}
.rz:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--acc) 60%,#000)}
.rz[disabled]{background:var(--line);color:var(--mut);box-shadow:none}
.ck{flex:none;font-size:13px;font-weight:800;color:var(--ok)}
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,16,32,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;animation:fi .15s}
@keyframes fi{from{opacity:0}}
.sh{width:100%;max-width:440px;background:var(--card);border-radius:22px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:up .2s ease-out;margin-bottom:env(safe-area-inset-bottom)}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sh h3{margin:0 0 6px;font-size:19px;font-weight:800}
.sh p{margin:0 0 14px;font-size:15px;color:var(--mut);font-weight:600;line-height:1.45}
.sh .bt{display:flex;gap:8px}.sh .bt button{flex:1;padding:13px;border-radius:14px;font-weight:800;font-size:15px}
.sh .no{border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.sh .ok{border:0;background:var(--acc);color:#fff}
.sh .ok.r{background:var(--bad)}
.ts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;max-width:calc(100% - 32px);padding:12px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:700;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:up .2s}
.ts.bad{background:var(--bad);color:#fff}
.big{text-align:center;padding:40px 20px}.big b{display:block;font-size:20px;margin-bottom:8px}.big p{color:var(--mut);font-weight:600;line-height:1.5;margin:0}
.ft{text-align:center;font-size:12px;color:var(--mut);font-weight:600;margin-top:8px;line-height:1.5}
.sk{height:60px;border-radius:14px;background:linear-gradient(90deg,var(--line),var(--bg),var(--line));background-size:200% 100%;animation:sk 1.2s linear infinite;margin-bottom:8px}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="w" id="app"><div class="hd"><img src="icon-192.png?v=2" alt=""><div class="t"><small>Alya Pilates</small><b>Online randevu</b></div></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
<script>
(function(){
  const SB_URL='https://npiwcjrkpkbbjjppusve.supabase.co',SB_KEY='sb_publishable_Wh3iwrcun4HvaTbWt73Tgw_Jp_Vh8x6';
  const GUN=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'],GUNF=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'],AY=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  const TUR={grup:'Grup',bireysel:'Bireysel'};
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const app=document.getElementById('app');
  // anahtar: bağlantıdaki # kısmı; ana ekrandan açılınca da çalışsın diye cihazda saklanır
  let tok='';try{const h=decodeURIComponent((location.hash||'').slice(1));if(h){tok=h;localStorage.setItem('alya_rv',h)}else tok=localStorage.getItem('alya_rv')||''}catch(e){tok=(location.hash||'').slice(1)}
  const rpc=async(fn,args)=>{const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});if(!r.ok)throw new Error('Bağlantı hatası ('+r.status+')');return r.json()};
  const dt=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
  const dLbl=s=>{const d=dt(s),t=new Date();t.setHours(0,0,0,0);const df=Math.round((d-t)/864e5);return df===0?'Bugün':df===1?'Yarın':GUNF[d.getDay()]};
  const hd=ad=>'<div class="hd"><img src="icon-192.png?v=2" alt=""><div class="t"><small>Alya Pilates</small><b>'+(ad?'Merhaba '+esc(String(ad).split(' ')[0]):'Online randevu')+'</b></div><button class="rf" data-rf="1" aria-label="Yenile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button></div>';
  let D=null,day='',busy=false;
  const toast=(t,bad)=>{document.querySelectorAll('.ts').forEach(x=>x.remove());const e=document.createElement('div');e.className='ts'+(bad?' bad':'');e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3200)};
  const ask=(title,txt,okT,red)=>new Promise(res=>{const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="sh"><h3>'+esc(title)+'</h3><p>'+txt+'</p><div class="bt"><button class="no">Vazgeç</button><button class="ok'+(red?' r':'')+'">'+esc(okT)+'</button></div></div>';document.body.appendChild(o);
    o.addEventListener('click',e=>{if(e.target===o||e.target.closest('.no')){o.remove();res(false)}else if(e.target.closest('.ok')){o.remove();res(true)}})});
  async function load(){
    if(!tok){app.innerHTML=hd('')+'<div class="sc big"><b>Bağlantı bulunamadı</b><p>Randevu sayfasını stüdyonun WhatsApp’tan gönderdiği kişisel bağlantıdan aç.</p></div>';return}
    const rf=app.querySelector('.rf');if(rf)rf.classList.add('spin');
    try{D=await rpc('rv_bilgi',{p_token:tok})}catch(e){app.innerHTML=hd('')+'<div class="sc big"><b>Bağlanılamadı</b><p>İnternet bağlantını kontrol edip yenile.</p></div>';return}
    if(!D||!D.ok){try{localStorage.removeItem('alya_rv')}catch(e){}app.innerHTML=hd('')+'<div class="sc big"><b>Bağlantı geçersiz</b><p>Bu bağlantının süresi dolmuş ya da yenilenmiş. Stüdyodan yeni bağlantı iste.</p></div>';return}
    const ds=[...new Set(D.seanslar.map(s=>s.tarih))];if(!ds.includes(day))day=ds[0]||'';
    draw();
  }
  function draw(){
    const K=D.kalan||{},kv=t=>K[t]>=999?'∞':Math.max(0,K[t]|0);
    let h=hd(D.ad);
    h+='<div class="kl">'+['grup','bireysel'].map(t=>'<div class="kc"><small>'+TUR[t]+' ders hakkı</small><b class="'+(K[t]<=0?'z':'')+'">'+kv(t)+'</b><i>'+(K[t]>=999?'Multisport':'kalan')+'</i></div>').join('')+'</div>';
    h+='<div class="sc"><h2>Randevularım</h2><div class="rl">'+(D.randevular.length?D.randevular.map(r=>{const d=dt(r.tarih);return '<div class="ri"><div class="d"><small>'+GUN[d.getDay()]+'</small><b>'+d.getDate()+'</b></div><div class="x"><b>'+esc(r.saat)+' · '+TUR[r.tur]+'</b><small>'+dLbl(r.tarih)+', '+d.getDate()+' '+AY[d.getMonth()]+'</small></div><button class="ip" data-ip="'+esc(r.id)+'"'+(r.iptal?'':' disabled title="İptal süresi geçti"')+'>'+(r.iptal?'İptal et':'Süresi geçti')+'</button></div>'}).join(''):'<div class="em">Yaklaşan randevun yok.</div>')+'</div></div>';
    if(!D.acik){h+='<div class="sc big"><b>Online randevu şu an kapalı</b><p>Randevu için stüdyo ile iletişime geçebilirsin.</p></div>'}
    else{
      const ds=[...new Set(D.seanslar.map(s=>s.tarih))];
      h+='<div class="sc"><h2>Randevu al</h2>';
      if(!ds.length)h+='<div class="em">Önümüzdeki günlerde açık seans yok.</div>';
      else{
        h+='<div class="dy">'+ds.map(s=>{const d=dt(s),bos=D.seanslar.filter(x=>x.tarih===s&&x.dolu<x.kap).length;return '<button data-day="'+s+'" class="'+(s===day?'on':'')+'"><small>'+GUN[d.getDay()]+'</small><b>'+d.getDate()+'</b><i>'+(bos?bos+' boş':'dolu')+'</i></button>'}).join('')+'</div>';
        const ls=D.seanslar.filter(s=>s.tarih===day);const d=dt(day);
        h+='<div class="em" style="padding:2px 0 10px;text-align:left;font-weight:800;color:var(--ink)">'+dLbl(day)+' · '+d.getDate()+' '+AY[d.getMonth()]+'</div><div class="sl">'+ls.map(s=>{const kal=s.kap-s.dolu,hak=(K[s.tur]|0)>0;
          return '<div class="si"><b>'+esc(s.saat)+'</b><div class="x"><span class="tp'+(s.tur==='bireysel'?' b':'')+'">'+TUR[s.tur]+'</span>'
            +(s.benim?'<small class="m">✓ Randevun var</small>':kal>0?'<small>'+(s.tur==='bireysel'?'Boş':kal+' yer kaldı')+'</small>':'<small class="f">Dolu</small>')+'</div>'
            +(s.benim?'<span class="ck">✓</span>':'<button class="rz" data-rz="'+esc(s.tarih+'|'+s.saat+'|'+s.tur)+'"'+(kal>0&&hak?'':' disabled')+'>'+(kal<=0?'Dolu':!hak?'Hak yok':'Rezerve et')+'</button>')+'</div>'}).join('')+'</div>';
      }
      h+='</div>';
      h+='<div class="ft">İptal, derse '+D.iptalSaat+' saat kalana kadar yapılabilir. En fazla '+D.ileriGun+' gün sonrasına randevu alınabilir.</div>';
    }
    h+='<div class="ft" style="margin-top:14px">Bu sayfa sana özel. Bağlantıyı kimseyle paylaşma.</div>';
    app.innerHTML=h;
  }
  app.addEventListener('click',async e=>{
    const b=e.target.closest('button');if(!b||busy)return;
    if(b.dataset.rf){load();return}
    if(b.dataset.day){day=b.dataset.day;draw();return}
    if(b.dataset.rz){const [t,s,tur]=b.dataset.rz.split('|'),d=dt(t);
      if(!await ask('Randevuyu onayla','<b style="color:var(--ink)">'+dLbl(t)+', '+d.getDate()+' '+AY[d.getMonth()]+' · '+esc(s)+'</b><br>'+TUR[tur]+' ders. 1 ders hakkın bu randevu için ayrılır.','Onayla'))return;
      busy=true;b.disabled=true;b.textContent='…';
      try{const r=await rpc('rv_al',{p_token:tok,p_tarih:t,p_saat:s,p_tur:tur});toast(r.mesaj||'',!r.ok)}catch(x){toast(x.message,1)}
      busy=false;await load();return}
    if(b.dataset.ip){const r0=D.randevular.find(r=>r.id===b.dataset.ip);if(!r0)return;const d=dt(r0.tarih);
      if(!await ask('Randevuyu iptal et',esc(dLbl(r0.tarih)+', '+d.getDate()+' '+AY[d.getMonth()]+' · '+r0.saat)+' randevun iptal edilecek. Ders hakkın geri gelir.','İptal et',1))return;
      busy=true;b.disabled=true;
      try{const r=await rpc('rv_iptal',{p_token:tok,p_id:r0.id});toast(r.mesaj||'',!r.ok)}catch(x){toast(x.message,1)}
      busy=false;await load();return}
  });
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&D)load()});
  load();
})();
</script>
</body>
